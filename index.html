<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="一个部署在 Azure Static Web Apps 上的 Hello World 示例。"
    />
    <title>Hello World</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="card">
      <img
        class="hero-image"
        src="/assets/hello-world.svg"
        alt="日出时分的山景插画"
        width="640"
        height="400"
      />
      <section class="content" aria-labelledby="page-title">
        <p class="eyebrow">AZURE STATIC WEB APPS</p>
        <h1 id="page-title">Hello, world!</h1>
        <p class="intro">这是一个简单的网页，图片、页面和后端 API 分开放置。</p>
        <p id="api-message" class="api-message" aria-live="polite">
          正在连接后端 API…
        </p>
      </section>
    </main>
  </body>
</html>
